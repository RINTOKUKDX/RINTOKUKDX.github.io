<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>定点カット試作</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f1f1f4;--ac:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--card:#222;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--card:#222;--ac:#60a5fa}
body{margin:0 auto;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;max-width:640px}
h1{font-size:18px;margin:0 0 8px}
h2{font-size:15px;margin:0 0 6px}
canvas{width:100%;background:#000;border-radius:8px;display:block}
#bar{height:70px;background:var(--card);margin-top:6px;touch-action:none}
.row{background:var(--card);border-radius:8px;padding:10px;margin:8px 0}
label{display:block;font-size:14px;margin:4px 0}
input[type=range]{width:100%}
button{font-size:16px;padding:12px;border:0;border-radius:8px;background:var(--ac);color:#fff;margin:4px 4px 4px 0}
button:disabled{opacity:.4}
.st{font-size:13px;opacity:.85}
.seg button{background:transparent;color:var(--fg);border:2px solid var(--ac);padding:8px 14px}
.seg button.on{background:var(--ac);color:#fff}
#pvw{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:4px}
#c{max-height:38vh;object-fit:contain}
details.row>summary{font-size:15px;font-weight:bold;cursor:pointer;list-style:none;padding:2px 0}
details.row>summary::before{content:"▶ ";font-size:12px}
details.row[open]>summary::before{content:"▼ "}
</style></head><body>
<h1>定点カット（試作）</h1>

<div class="row"><h2>① 読み込む</h2>
<input type="file" id="f" accept="video/*"></div>

<div id="pvw"><canvas id="c" width="640" height="360"></canvas>
<canvas id="bar" width="640" height="70"></canvas>
<div class="st" id="st">動画を選んでください</div>
<div class="st">画面タップ＝再生／停止。バーをタップ・なぞると再生位置が移動します</div></div>

<details class="row" open><summary>② 動きがない部分をカット</summary>
<button id="an" disabled style="display:none">解析する</button>
<label>動きなしと判定する基準 <b id="v6">1.0</b>%（大きいほど多くカット） <input type="range" id="mt" min="0.1" max="10" step="0.1" value="1"></label>
<label>この秒数以上 動きがなければカット <b id="v7">2</b>秒 <input type="range" id="ml" min="0.5" max="10" step="0.5" value="2"></label>
<label>カットの前後に残す余白 <b id="v8">0.3</b>秒 <input type="range" id="mg" min="0" max="2" step="0.1" value="0.3"></label>
<div class="st" id="rs">まだ解析していません</div>
<div class="st">バー：灰色の山＝動きの量、赤＝カットされる所、横線＝基準、黄色・水色の枠＝カメラ位置が同じ範囲（ブロック）</div>
</details>

<details class="row"><summary>③ 分身</summary>
<div class="seg" id="np">人数（本人こみ）
<button data-n="1" class="on">1人</button><button data-n="2">2人</button><button data-n="3">3人</button><button data-n="4">4人</button></div>
<div class="st" id="bk">解析すると、カメラ位置が同じ範囲（ブロック）を自動で見つけます。分身はブロックの中だけで重ねます</div>
<label>カメラが動いたと判定する基準 <b id="v9">60</b>%（画面のこれ以上が一度に変わったら） <input type="range" id="sc" min="30" max="95" step="5" value="60"></label>
<label>分身の切り抜き感度（小さいほど広く切り抜く） <b id="v10">40</b> <input type="range" id="ct" min="10" max="120" step="5" value="40"></label>
<label><input type="checkbox" id="ov2"> 分身の切り抜き範囲を色で表示（確認用）</label>
</details>

<details class="row"><summary>④ 早送り・ブラー</summary>
<label>早送り <b id="v1">1</b>倍（音は4倍まで残ります） <input type="range" id="sp" min="1" max="16" step="1" value="1"></label>
<label><input type="checkbox" id="be"> 動いた部分にブラーをかける</label>
<label>動き検出の感度（小さいほど敏感） <b id="v2">25</b> <input type="range" id="th" min="5" max="80" value="25"></label>
<label>ブラーの強さ <b id="v3">8</b> <input type="range" id="bl" min="0" max="30" value="8"></label>
<label>残像の長さ <b id="v4">60</b>% <input type="range" id="tr" min="0" max="90" value="60"></label>
<label>動き範囲の広げ具合 <b id="v5">10</b> <input type="range" id="dl" min="0" max="30" value="10"></label>
<label><input type="checkbox" id="ov"> 動き検出の範囲を赤で表示（確認用）</label>
</details>

<details class="row" open><summary>⑤ 書き出し</summary>
<button id="rc" disabled>書き出し（録画）</button>
<a id="dlk" style="display:none"></a>
<div class="st">残った部分を録画します（確認は画面タップで再生）。録画中は画面を閉じないでください</div>
</details>

<script>
const $=id=>document.getElementById(id);
const mkV=()=>{const e=document.createElement('video');e.muted=true;e.playsInline=true;e.preload='auto';return e};
const V=[mkV(),mkV(),mkV(),mkV()];const v=V[0];
const C=(w,h)=>{const k=document.createElement('canvas');if(w){k.width=w;k.height=h}return k};
const c=$('c'),x=c.getContext('2d'),bar=$('bar'),bx=bar.getContext('2d');
const S=160;let W=640,H=360,sw=S,sh=90;
const BW=320;let bh=180; // 背景・切り抜き用の解像度
const m=C(),mx=m.getContext('2d',{willReadFrequently:true});
const mk=C(),mkx=mk.getContext('2d'),t2=C(),t2x=t2.getContext('2d');
const tmp=C(),tx=tmp.getContext('2d'),tr=C(),trx=tr.getContext('2d');
const ovc=C(),ovx=ovc.getContext('2d'),cmp=C(),cx=cmp.getContext('2d');
const bgc=C(),bgx=bgc.getContext('2d',{willReadFrequently:true});
const fm=C(),fmx=fm.getContext('2d',{willReadFrequently:true}),fm2=C(),fm2x=fm2.getContext('2d'),lay=C(),lx=lay.getContext('2d');
let prev=null,running=false,rec=null,dur=0,url=null,posT=0;
let scores=[],thumbs=[],step=0.5,segs=[],blocks=[],bgs=[],np=1;
[['sp',1,1],['th',2,0],['bl',3,0],['tr',4,0],['dl',5,0],['mt',6,1],['ml',7,1],['mg',8,1],['sc',9,2],['ct',10,0]].forEach(([id,n,re])=>{
 const e=$(id);e.oninput=()=>{$('v'+n).textContent=e.value;if(re===2){calcBlocks();scheduleBgs();}if(re)calcSegs();};
});
document.querySelectorAll('#np button').forEach(b=>b.onclick=()=>{
 if(running)return;np=+b.dataset.n;document.querySelectorAll('#np button').forEach(q=>q.classList.toggle('on',q===b));calcSegs();});
function seekV(el,t){return new Promise(r=>{const h=()=>{el.removeEventListener('seeked',h);r()};el.addEventListener('seeked',h);el.currentTime=Math.min(t,Math.max(0,dur-0.05));})}
const seekTo=t=>seekV(v,t);
function fmt(t){t=Math.max(0,t);const mm=Math.floor(t/60),ss=(t%60).toFixed(1);return mm?`${mm}分${ss}秒`:`${ss}秒`}

$('f').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);
 V.forEach(el=>el.src=url);
 v.onloadedmetadata=()=>{
  dur=v.duration;
  const s=Math.min(1,1280/v.videoWidth);
  W=Math.round(v.videoWidth*s/2)*2;H=Math.round(v.videoHeight*s/2)*2;
  [c,tmp,tr,ovc,cmp,lay].forEach(k=>{k.width=W;k.height=H});
  sh=Math.round(S*H/W);[m,mk,t2].forEach(k=>{k.width=sw;k.height=sh});
  bh=Math.round(BW*H/W);[bgc,fm,fm2].forEach(k=>{k.width=BW;k.height=bh});
  scores=[];thumbs=[];blocks=[{s:0,e:dur}];bgs=[];segs=[{s:0,e:dur}];
  ['an','rc'].forEach(id=>$(id).disabled=false);
  $('st').textContent=`読み込みOK ${W}x${H} / ${fmt(dur)}`;
  $('rs').textContent='解析中…';
  seekTo(0).then(()=>{x.drawImage(v,0,0,W,H);drawBar();$('an').disabled=false;$('an').onclick();});
 };
};
function peek(t){if(!dur)return;posT=t;
 if(running){if(rec)return;jumpTo(t);return;}
 seekTo(t).then(()=>{x.drawImage(v,0,0,W,H);drawBar(undefined,t);$('st').textContent=fmt(t)+'（画面タップでここから再生）'})}
c.onclick=()=>{if(!dur||rec||bgBusy)return;if(running)stop();else start(posT);};

// ② 解析
const TW=32,TH=18;
$('an').onclick=async()=>{
 if(running)return;
 ['an','rc'].forEach(id=>$(id).disabled=true);
 step=Math.max(0.5,dur/1500);
 const n=Math.floor(dur/step)+1;scores=new Float32Array(n);thumbs=[];
 const tc=C(TW,TH),tcx=tc.getContext('2d',{willReadFrequently:true});
 let last=null;const t0=performance.now();
 for(let i=0;i<n;i++){
  await seekTo(i*step);
  mx.drawImage(v,0,0,sw,sh);const d=mx.getImageData(0,0,sw,sh).data;
  if(last){let ch=0;for(let k=0;k<d.length;k+=4){
    if(Math.abs(d[k]-last[k])+Math.abs(d[k+1]-last[k+1])+Math.abs(d[k+2]-last[k+2])>60)ch++;}
   scores[i]=ch/(sw*sh)*100;}
  last=d;
  tcx.drawImage(v,0,0,TW,TH);const td=tcx.getImageData(0,0,TW,TH).data,g=new Uint8Array(TW*TH);
  for(let k=0;k<g.length;k++)g[k]=(td[k*4]+td[k*4+1]+td[k*4+2])/3;thumbs.push(g);
  if(i%10===0){x.drawImage(v,0,0,W,H);
   const el=(performance.now()-t0)/1000,rest=el/(i+1)*(n-i-1);
   $('st').textContent=`解析中 ${Math.round(i/n*100)}%（残り約${Math.ceil(rest)}秒）`;drawBar(i);}
 }
 if(n>1)scores[0]=scores[1];
 calcBlocks();
 await makeBgs();
 calcSegs();
 ['an','rc'].forEach(id=>$(id).disabled=false);
 $('st').textContent='解析完了。スライダーで調整できます';
};
// カメラ位置の変わり目：小さな画で、画面の大部分が一度に変わり、その後も戻らない所
function fracDiff(a,b){let k=0;for(let i=0;i<a.length;i++)if(Math.abs(a[i]-b[i])>25)k++;return k/a.length*100}
function calcBlocks(){
 if(!thumbs.length){blocks=[{s:0,e:dur}];return;}
 const th=+$('sc').value,n=thumbs.length,cut=[0];
 for(let i=1;i<n;i++){
  if(fracDiff(thumbs[i-1],thumbs[i])<th)continue;
  const j=Math.min(n-1,i+3);
  if(j>i&&fracDiff(thumbs[i-1],thumbs[j])<th)continue; // すぐ戻る＝人が横切っただけ
  if((i-cut[cut.length-1])*step<3)continue;
  cut.push(i);
 }
 blocks=cut.map((ci,k)=>({s:ci*step,e:k+1<cut.length?cut[k+1]*step:dur}));
}
let bgTimer=0,bgBusy=false;
function scheduleBgs(){
 if(!thumbs.length)return;bgs=[];clearTimeout(bgTimer);
 $('bk').textContent='ブロックが変わったので背景を作り直します…';
 bgTimer=setTimeout(async function go(){
  if(running||bgBusy){bgTimer=setTimeout(go,500);return;}
  bgBusy=true;['an','rc'].forEach(id=>$(id).disabled=true);
  await makeBgs();bgBusy=false;['an','rc'].forEach(id=>$(id).disabled=false);
  calcSegs();$('st').textContent='背景を作り直しました';
 },700);
}
// ブロックごとの背景：何枚かのコマの中央値（動く人が消える）
async function makeBgs(){
 bgs=[];
 for(let b=0;b<blocks.length;b++){
  const B=blocks[b],K=Math.max(3,Math.min(15,Math.floor((B.e-B.s)/step)));
  const fr=[];
  for(let k=0;k<K;k++){await seekTo(B.s+(B.e-B.s)*(k+0.5)/K);bgx.drawImage(v,0,0,BW,bh);fr.push(bgx.getImageData(0,0,BW,bh).data);
   $('st').textContent=`背景を作成中 ブロック${b+1}/${blocks.length}`;}
  const out=bgx.createImageData(BW,bh),o=out.data,tmpA=new Uint8Array(K),mid=K>>1;
  for(let i=0;i<o.length;i++){if((i&3)===3){o[i]=255;continue;}
   for(let k=0;k<K;k++)tmpA[k]=fr[k][i];tmpA.sort();o[i]=tmpA[mid];}
  bgs.push(out);
 }
}
function calcSegs(){
 if(!scores.length){segs=[{s:0,e:dur}];}
 else{
  const th=+$('mt').value,ml=+$('ml').value,mg=+$('mg').value;
  const cuts=[];let st=-1;
  for(let i=0;i<=scores.length;i++){
   const still=i<scores.length&&scores[i]<th;
   if(still&&st<0)st=i;
   if(!still&&st>=0){const a=st*step,b=Math.min(dur,i*step);
    if(b-a>=ml){const ca=a===0?0:a+mg,cb=b>=dur-step?dur:b-mg;if(cb-ca>0.1)cuts.push([ca,cb]);}
    st=-1;}
  }
  segs=[];let p=0;
  cuts.forEach(([a,b])=>{if(a-p>0.1)segs.push({s:p,e:a});p=b;});
  if(dur-p>0.1)segs.push({s:p,e:dur});
 }
 const keep=segs.reduce((q,s)=>q+s.e-s.s,0),out=planLen();
 const sp=+$('sp').value;
 $('rs').textContent=`${fmt(dur)} → カット後 ${fmt(keep)}`+(np>1?` → 分身${np}人で ${fmt(out)}`:'')+(sp>1?` → ${sp}倍速で ${fmt(out/sp)}`:'');
 $('bk').textContent=scores.length?`カメラ位置：${blocks.length}ブロック（${blocks.map(b=>fmt(b.s)).join('／')} から）`:$('bk').textContent;
 drawBar();
}
// ブロック×分身の再生計画
function rangesIn(B){const r=[];segs.forEach(s=>{const a=Math.max(s.s,B.s),b=Math.min(s.e,B.e);if(b-a>0.05)r.push({s:a,e:b})});return r}
function slice(r,from,to){ // 残った時間軸上の from〜to を元の時刻の区間に
 const o=[];let acc=0;
 r.forEach(q=>{const L=q.e-q.s,a=Math.max(from,acc),b=Math.min(to,acc+L);if(b-a>0.02)o.push({s:q.s+a-acc,e:q.s+b-acc});acc+=L;});
 return o;
}
function makePlan(){
 const P=[];
 blocks.forEach((B,bi)=>{
  const r=rangesIn(B),L=r.reduce((q,s)=>q+s.e-s.s,0);if(L<0.1)return;
  const n=Math.min(np,Math.max(1,Math.floor(L/1)));
  const part=L/n,layers=[];
  for(let k=0;k<n;k++)layers.push(slice(r,k*part,(k+1)*part));
  P.push({bi,layers,len:part});
 });
 return P;
}
function locate(t){ // 元の時刻 t → {pi, off(ブロック内の経過)}
 for(let i=0;i<plan.length;i++){const B=blocks[plan[i].bi];if(t<B.s||t>=B.e)continue;
  for(const L of plan[i].layers){let acc=0;for(const r of L){if(t<r.e){return {pi:i,off:acc+Math.max(0,t-r.s)};}acc+=r.e-r.s;}}
  return {pi:i,off:0};}
 for(let i=0;i<plan.length;i++)if(blocks[plan[i].bi].s>=t)return {pi:i,off:0};
 return {pi:0,off:0};
}
function where(L,off){let acc=0;for(let j=0;j<L.length;j++){const len=L[j].e-L[j].s;if(off<acc+len-0.02)return {j,t:L[j].s+off-acc};acc+=len;}return null}
function planLen(){return makePlan().reduce((q,p)=>q+p.len,0)}

function drawBar(upto,cur){
 const bw=bar.width=bar.clientWidth*devicePixelRatio||640,bhh=bar.height=70*devicePixelRatio;
 bx.clearRect(0,0,bw,bhh);if(!dur)return;
 const X=t=>t/dur*bw;
 if(scores.length&&upto===undefined){bx.fillStyle='rgba(229,57,53,.45)';let p=0;
  segs.forEach(s=>{if(s.s>p)bx.fillRect(X(p),0,X(s.s)-X(p),bhh);p=s.e});if(p<dur)bx.fillRect(X(p),0,bw-X(p),bhh);}
 if(scores.length){const mxs=Math.max(5,+$('mt').value*3);bx.fillStyle='rgba(128,128,128,.8)';
  const n=upto===undefined?scores.length:upto;
  for(let i=0;i<n;i++){const h=Math.min(1,scores[i]/mxs)*bhh;bx.fillRect(X(i*step),bhh-h,Math.max(1,X(step)),h);}
  const ty=bhh-Math.min(1,+$('mt').value/mxs)*bhh;bx.fillStyle='#e53935';bx.fillRect(0,ty,bw,2*devicePixelRatio);}
 if(upto===undefined&&scores.length){const dp=devicePixelRatio,cols=['#f5b800','#00b0ff'];
  bx.font=`bold ${11*dp}px sans-serif`;bx.textBaseline='top';
  blocks.forEach((B,i)=>{const a=X(B.s),w=X(B.e)-a,col=cols[i%2];
   bx.strokeStyle=col;bx.lineWidth=3*dp;bx.strokeRect(a+1.5*dp,1.5*dp,w-3*dp,bhh-3*dp);
   bx.fillStyle=col;const lb='ブロック'+(i+1);const tw=bx.measureText(lb).width+6*dp;
   if(w>tw+4*dp){bx.fillRect(a+3*dp,3*dp,tw,14*dp);bx.fillStyle='#000';bx.fillText(lb,a+6*dp,4*dp);}
  });}
 bx.fillStyle='#2563eb';
 const ts=running?V.slice(0,curN).map(e=>e.currentTime):[cur===undefined?v.currentTime:cur];
 ts.forEach(t=>bx.fillRect(X(t)-1,0,3*devicePixelRatio,bhh));
}
let barT=0;bar.onpointerdown=bar.onpointermove=e=>{if(!dur||rec||(e.type==='pointermove'&&!e.buttons))return;if(running&&e.type==='pointermove'&&performance.now()-barT<250)return;barT=performance.now();
 const r=bar.getBoundingClientRect(),t=(e.clientX-r.left)/r.width*dur;peek(Math.max(0,Math.min(dur,t)));};

// 切り抜きを「中身の詰まった形」にする（半透明・穴あき対策）
let mA=null,mB=null,mQ=null;
function solidMask(a,b,th){
 const w=BW,h=bh,n=w*h;
 if(!mA||mA.length!==n){mA=new Float32Array(n);mB=new Uint8Array(n);mQ=new Int32Array(n);}
 for(let i=0,j=0;i<n;i++,j+=4)mA[i]=Math.abs(a[j]-b[j])+Math.abs(a[j+1]-b[j+1])+Math.abs(a[j+2]-b[j+2]);
 // 3x3 平均でざらつきを減らしてから判定
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,c=0;
  for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=h)continue;for(let dx=-1;dx<=1;dx++){const xx=x+dx;if(xx<0||xx>=w)continue;s+=mA[yy*w+xx];c++;}}
  mB[y*w+x]=s/c>th?1:0;}
 const grow=(src,r,val)=>{ // val=1:広げる 0:縮める
  const t=new Uint8Array(n);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let hit=!val;for(let dx=-r;dx<=r;dx++){const xx=x+dx;const q=xx<0||xx>=w?!val:src[y*w+xx];if(val?q:!q){hit=val;break;}}t[y*w+x]=hit?1:0;}
  const o=new Uint8Array(n);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let hit=!val;for(let dy=-r;dy<=r;dy++){const yy=y+dy;const q=yy<0||yy>=h?!val:t[yy*w+x];if(val?q:!q){hit=val;break;}}o[y*w+x]=hit?1:0;}
  return o;};
 let M=grow(mB,4,1);M=grow(M,3,0); // すき間を閉じる
 // 外側から届かない「穴」を埋める
 const vis=new Uint8Array(n);let qh=0,qt=0;
 const push=i=>{if(!vis[i]&&!M[i]){vis[i]=1;mQ[qt++]=i;}};
 for(let x=0;x<w;x++){push(x);push((h-1)*w+x);}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1);}
 while(qh<qt){const i=mQ[qh++],x=i%w;if(x>0)push(i-1);if(x<w-1)push(i+1);if(i>=w)push(i-w);if(i<n-w)push(i+w);}
 for(let i=0;i<n;i++)if(!vis[i])M[i]=1;
 return M;
}
// 分身の合成：1人目はそのまま、2人目以降は「背景と違う所」だけ重ねる
function compose(n,bi){
 cx.globalCompositeOperation='source-over';cx.drawImage(V[0],0,0,W,H);
 const bg=bgs[bi];if(n<2||!bg)return;
 const th=+$('ct').value*3,show=$('ov2').checked,cols=['','rgba(0,200,255,.45)','rgba(255,0,200,.45)','rgba(0,255,100,.45)'];
 for(let k=1;k<n;k++){
  if(lay_done[k])continue;
  fmx.drawImage(V[k],0,0,BW,bh);const d=fmx.getImageData(0,0,BW,bh),a=d.data,b=bg.data;
  const M=solidMask(a,b,th);
  for(let i=0,j=3;i<M.length;i++,j+=4)a[j]=M[i]?255:0;
  fmx.putImageData(d,0,0);
  fm2x.clearRect(0,0,BW,bh);fm2x.filter='blur(2px)';fm2x.drawImage(fm,0,0);fm2x.filter='none';
  lx.globalCompositeOperation='source-over';lx.clearRect(0,0,W,H);lx.drawImage(V[k],0,0,W,H);
  lx.globalCompositeOperation='destination-in';lx.drawImage(fm2,0,0,W,H);
  if(show){lx.globalCompositeOperation='source-atop';lx.fillStyle=cols[k];lx.fillRect(0,0,W,H);}
  cx.drawImage(lay,0,0);
 }
}
// ④ ブラー（合成後の画に対して）
function frame(src){
 x.globalAlpha=1;x.globalCompositeOperation='source-over';
 if(!$('be').checked){x.drawImage(src,0,0,W,H);return;}
 const th=+$('th').value,bl=+$('bl').value,tl=+$('tr').value/100,dl=+$('dl').value;
 mx.drawImage(src,0,0,sw,sh);
 const cur=mx.getImageData(0,0,sw,sh),out=t2x.createImageData(sw,sh);
 if(prev){const a=cur.data,b=prev.data,o=out.data;
  for(let i=0;i<a.length;i+=4){
   const d=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);
   o[i+3]=d>th*3?255:0;o[i]=255;}}
 prev=cur;t2x.putImageData(out,0,0);
 mkx.clearRect(0,0,sw,sh);mkx.filter=`blur(${dl*sw/W*2}px)`;mkx.drawImage(t2,0,0);mkx.filter='none';
 x.drawImage(src,0,0,W,H);
 trx.globalCompositeOperation='destination-out';trx.fillStyle=`rgba(0,0,0,${1-tl})`;trx.fillRect(0,0,W,H);
 trx.globalCompositeOperation='source-over';
 tx.globalCompositeOperation='source-over';tx.clearRect(0,0,W,H);
 tx.filter=bl>0?`blur(${bl}px)`:'none';tx.drawImage(src,0,0,W,H);tx.filter='none';
 tx.globalCompositeOperation='destination-in';tx.drawImage(mk,0,0,W,H);tx.globalCompositeOperation='source-over';
 x.drawImage(tr,0,0);x.drawImage(tmp,0,0);trx.drawImage(tmp,0,0);
 if($('ov').checked){ovx.globalCompositeOperation='source-over';ovx.clearRect(0,0,W,H);ovx.drawImage(mk,0,0,W,H);
  ovx.globalCompositeOperation='source-in';ovx.fillStyle='rgba(255,0,0,.5)';ovx.fillRect(0,0,W,H);x.drawImage(ovc,0,0);}
}

// ⑤ 再生：ブロックを順番に、ブロック内は人数分の動画を同時に再生
let plan=[],pi=0,curN=1,ri=[0,0,0,0],lay_done=[0,0,0,0],seeking=[0,0,0,0],switching=false;
async function startBlock(off=0){
 const p=plan[pi];curN=p.layers.length;switching=true;
 if(rec&&rec.state==='recording')rec.pause();
 V.forEach(e=>e.pause());
 for(let k=0;k<4;k++){ri[k]=0;lay_done[k]=k>=curN?1:0;seeking[k]=0;}
 await Promise.all(p.layers.map((L,k)=>{const w=where(L,off);if(!w){lay_done[k]=1;return null;}ri[k]=w.j;return seekV(V[k],w.t);}));
 const sp=+$('sp').value;
 p.layers.forEach((L,k)=>{V[k].playbackRate=sp;});
 prev=null;trx.clearRect(0,0,W,H);
 await Promise.all(p.layers.map((L,k)=>lay_done[k]?null:V[k].play()));
 if(rec&&rec.state==='paused')rec.resume();
 switching=false;
}
async function advance(k){
 const L=plan[pi].layers[k];ri[k]++;
 if(ri[k]>=L.length){lay_done[k]=1;V[k].pause();return;}
 seeking[k]=1;await seekV(V[k],L[ri[k]].s);seeking[k]=0;
}
function tick(){
 if(!running)return;
 if(!switching){
  const p=plan[pi];
  for(let k=0;k<curN;k++){if(lay_done[k]||seeking[k])continue;const r=p.layers[k][ri[k]];
   if(V[k].currentTime>=r.e-0.02||V[k].ended)advance(k);}
  if(lay_done[0]){pi++;if(pi>=plan.length){stop();posT=0;return;}startBlock();}
  else{compose(curN,p.bi);frame(cmp);drawBar();
   $('st').textContent=`再生 ブロック${p.bi+1} 分身${curN}人`+(rec?'（録画中・画面を閉じないで）':'');}
 }
 requestAnimationFrame(tick);
}
async function start(fromT=0){
 plan=makePlan();
 if(!plan.length){$('st').textContent='残る部分がありません。基準を下げてください';return false;}
 const L=locate(fromT);
 running=true;pi=L.pi;['an','rc'].forEach(id=>$(id).disabled=true);
 await startBlock(L.off);
 if(rec)rec.state==='inactive'&&rec.start();
 requestAnimationFrame(tick);return true;
}
async function jumpTo(t){if(switching)return;const L=locate(t);pi=L.pi;await startBlock(L.off);}
function stop(){
 if(running&&!rec)posT=V[0].currentTime;
 running=false;V.forEach(e=>e.pause());
 if(rec&&rec.state!=='inactive')rec.stop();
 ['an','rc'].forEach(id=>$(id).disabled=false);
 if(!rec)$('st').textContent='停止しました（画面タップで続きから再生）';
}

let actx=null,adst=null;
function audioTrack(){
 try{
  if(!actx){actx=new AudioContext();const src=actx.createMediaElementSource(v);adst=actx.createMediaStreamDestination();src.connect(adst);}
  actx.resume();return adst.stream.getAudioTracks()[0];
 }catch(e){return null}
}
$('rc').onclick=()=>{
 if(running)return;
 const stream=c.captureStream(30);
 const at=audioTrack();if(at){stream.addTrack(at);v.muted=false;}
 const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
 const chunks=[];rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:8e6});
 rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 rec.onstop=()=>{
  v.muted=true;
  const ext=mt.includes('mp4')?'mp4':'webm';const blob=new Blob(chunks,{type:mt||'video/webm'});rec=null;
  const a=$('dlk');a.textContent='★保存する（タップ）';a.style.cssText='display:block;font-size:18px;padding:12px;color:var(--ac)';
  a.href=URL.createObjectURL(blob);a.download='teiten_cut.'+ext;
  $('st').textContent='録画完了。下のリンクから保存';
 };
 $('dlk').style.display='none';
 start(0).then(ok=>{if(!ok)rec=null});
};
window.addEventListener('resize',()=>drawBar());
