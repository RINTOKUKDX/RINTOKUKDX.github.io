<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>動き残像ブラー試作</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f1f1f4;--ac:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--card:#222;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--card:#222;--ac:#60a5fa}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;max-width:640px;margin:auto}
h1{font-size:18px}
canvas{width:100%;background:#000;border-radius:8px}
.row{background:var(--card);border-radius:8px;padding:10px;margin:8px 0}
label{display:block;font-size:14px}
input[type=range]{width:100%}
button{font-size:16px;padding:12px;border:0;border-radius:8px;background:var(--ac);color:#fff;margin:4px 4px 4px 0}
button:disabled{opacity:.4}
#st{font-size:13px;opacity:.8}
</style></head><body>
<h1>動き部分だけブラー（試作）</h1>
<div class="row"><input type="file" id="f" accept="video/*"></div>
<canvas id="c" width="640" height="360"></canvas>
<div id="st">動画を選んでください</div>
<div class="row"><b>カット範囲</b>
<label>位置 <b id="vp">0</b>秒 <input type="range" id="sk" min="0" max="100" step="0.1" value="0" disabled></label>
<button id="bs" disabled>ここを開始に</button><button id="be" disabled>ここを終了に</button>
<div id="rg">開始 0 秒 〜 終了 0 秒</div></div>
<div class="row">
<label>早送り <b id="v1">4</b>倍 <input type="range" id="sp" min="1" max="16" step="1" value="4"></label>
<label>動き検出の感度（小さいほど敏感） <b id="v2">25</b> <input type="range" id="th" min="5" max="80" value="25"></label>
<label>ブラーの強さ <b id="v3">8</b> <input type="range" id="bl" min="0" max="30" value="8"></label>
<label>残像の長さ <b id="v4">60</b>% <input type="range" id="tr" min="0" max="90" value="60"></label>
<label>動き範囲の広げ具合 <b id="v5">10</b> <input type="range" id="dl" min="0" max="30" value="10"></label>
<label><input type="checkbox" id="ov"> 動き検出の範囲を赤で表示（確認用）</label>
</div>
<button id="pv" disabled>プレビュー</button>
<button id="rc" disabled>書き出し（録画）</button>
<a id="dlk" style="display:none"></a>
<script>
const $=id=>document.getElementById(id);
const v=document.createElement('video');v.muted=true;v.playsInline=true;
const c=$('c'),x=c.getContext('2d');
const S=160; // 検出用の小さい解像度の幅
let W=640,H=360,sw=S,sh=90;
const m=document.createElement('canvas'),mx=m.getContext('2d',{willReadFrequently:true}); // 検出用
const mk=document.createElement('canvas'),mkx=mk.getContext('2d'); // マスク(小)
const tmp=document.createElement('canvas'),tx=tmp.getContext('2d');
const tr=document.createElement('canvas'),trx=tr.getContext('2d');
let t0=0,t1=0;
function rg(){$('rg').textContent=`開始 ${t0.toFixed(1)} 秒 〜 終了 ${t1.toFixed(1)} 秒（${(t1-t0).toFixed(1)}秒分）`}
$('sk').oninput=()=>{v.currentTime=+$('sk').value;$('vp').textContent=(+$('sk').value).toFixed(1)};
$('bs').onclick=()=>{t0=+$('sk').value;if(t1<=t0)t1=v.duration;rg()};
$('be').onclick=()=>{const t=+$('sk').value;if(t>t0){t1=t;rg()}};
let prev=null,running=false,rec=null;
['sp','th','bl','tr','dl'].forEach((id,i)=>{const e=$(id);e.oninput=()=>$('v'+(i+1)).textContent=e.value});
$('f').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 v.src=URL.createObjectURL(f);
 v.onloadedmetadata=()=>{
  const sc=Math.min(1,1280/v.videoWidth);
  W=Math.round(v.videoWidth*sc/2)*2;H=Math.round(v.videoHeight*sc/2)*2;
  c.width=W;c.height=H;tmp.width=W;tmp.height=H;tr.width=W;tr.height=H;
  sw=S;sh=Math.round(S*H/W);m.width=sw;m.height=sh;mk.width=sw;mk.height=sh;
  $('st').textContent=`読み込みOK ${W}x${H} / ${v.duration.toFixed(1)}秒`;
  $('sk').max=v.duration;$('sk').disabled=false;$('bs').disabled=false;$('be').disabled=false;t0=0;t1=v.duration;rg();$('pv').disabled=false;$('rc').disabled=false;
  v.currentTime=0;
 };
};
function frame(){
 const th=+$('th').value,bl=+$('bl').value,tl=+$('tr').value/100,dl=+$('dl').value;
 // 1)検出
 mx.drawImage(v,0,0,sw,sh);
 const cur=mx.getImageData(0,0,sw,sh);
 const out=mkx.createImageData(sw,sh);
 if(prev){const a=cur.data,b=prev.data,o=out.data;
  for(let i=0;i<a.length;i+=4){
   const d=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);
   o[i+3]=d>th*3?255:0;o[i]=255;
  }}
 prev=cur;
 // マスクを広げてぼかす
 mkx.clearRect(0,0,sw,sh);
 const t2=document.createElement('canvas');t2.width=sw;t2.height=sh;
 t2.getContext('2d').putImageData(out,0,0);
 mkx.filter=`blur(${dl*sw/W*2}px)`;mkx.drawImage(t2,0,0);mkx.filter='none';
 // 2)元フレーム
 x.globalAlpha=1;x.drawImage(v,0,0,W,H);
 // 3)残像(前の動き部分を薄く残す)
 trx.globalCompositeOperation='destination-out';
 trx.fillStyle=`rgba(0,0,0,${1-tl})`;trx.fillRect(0,0,W,H);
 trx.globalCompositeOperation='source-over';
 // 4)ブラー+マスク
 tx.globalCompositeOperation='source-over';tx.clearRect(0,0,W,H);
 tx.filter=bl>0?`blur(${bl}px)`:'none';tx.drawImage(v,0,0,W,H);tx.filter='none';
 tx.globalCompositeOperation='destination-in';tx.drawImage(mk,0,0,W,H);tx.globalCompositeOperation='source-over';
 x.drawImage(tr,0,0); // 残像
 x.drawImage(tmp,0,0); // 今の動き(ブラー)
 trx.drawImage(tmp,0,0);
 if($('ov').checked){x.globalAlpha=.4;x.fillStyle='red';
  x.globalCompositeOperation='source-atop';x.globalAlpha=1;x.globalCompositeOperation='source-over';
  const t3=document.createElement('canvas');t3.width=W;t3.height=H;const q=t3.getContext('2d');
  q.drawImage(mk,0,0,W,H);q.globalCompositeOperation='source-in';q.fillStyle='rgba(255,0,0,.5)';q.fillRect(0,0,W,H);
  x.drawImage(t3,0,0);}
}
function loop(){
 if(!running)return;
 frame();
 $('st').textContent=`${v.currentTime.toFixed(1)} / ${t1.toFixed(1)}秒`+(rec?'（録画中）':'');
 if(v.ended||v.currentTime>=t1){stop();return;}
 if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(loop);else requestAnimationFrame(loop);
}
function start(){
 prev=null;trx.clearRect(0,0,W,H);
 v.currentTime=t0;v.playbackRate=+$('sp').value;
 running=true;v.play().then(loop);
}
function stop(){
 running=false;v.pause();
 if(rec){rec.stop();}
 $('pv').textContent='プレビュー';
}
$('pv').onclick=()=>{if(running){stop();return;}$('pv').textContent='停止';start();};
$('rc').onclick=()=>{
 if(running)return;
 const stream=c.captureStream(30);
 const mt=['video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
 const chunks=[];rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:8e6});
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{
  const ext=(mt.includes('mp4')?'mp4':'webm');
  const blob=new Blob(chunks,{type:mt});rec=null;
  const a=$('dlk');a.textContent='★保存する（タップ）';a.style.cssText='display:block;font-size:18px;padding:12px;color:var(--ac)';a.href='#';
  a.onclick=async ev=>{ev.preventDefault();
   if(typeof claude==='undefined'){a.href=URL.createObjectURL(blob);a.download='blur_test.'+ext;a.onclick=null;a.click();return;}
   try{const d=await claude.use('downloads');if(!d){$('st').textContent='この画面では保存できません';return;}
    await d.save({filename:'blur_test.'+ext,data:blob});$('st').textContent='保存しました';}
   catch(e){$('st').textContent='保存できませんでした: '+(e.code||e.message);}};
  $('st').textContent='録画完了。下のリンクから保存';
 };
 rec.start();start();
};
</script></body></html>
