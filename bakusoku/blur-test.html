<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>定点カット試作</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f1f1f4;--ac:#2563eb;--cut:#e53935}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--card:#222;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--card:#222;--ac:#60a5fa}
body{margin:0 auto;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;max-width:640px}
h1{font-size:18px;margin:0 0 8px}
h2{font-size:15px;margin:0 0 6px}
canvas{width:100%;background:#000;border-radius:8px;display:block}
#bar{height:70px;background:var(--card);margin-top:6px;touch-action:none}
.row{background:var(--card);border-radius:8px;padding:10px;margin:8px 0}
label{display:block;font-size:14px;margin:4px 0}
input[type=range]{width:100%}
button{font-size:16px;padding:12px;border:0;border-radius:8px;background:var(--ac);color:#fff;margin:4px 4px 4px 0}
button:disabled{opacity:.4}
.st{font-size:13px;opacity:.85}
.mode label{display:inline-block;margin-right:16px;font-size:15px}
.tl{display:none}
body.tlmode .tl{display:block}
</style></head><body>
<h1>定点カット（試作）</h1>

<div class="row"><h2>① 読み込む</h2>
<input type="file" id="f" accept="video/*">
<div class="mode" style="margin-top:8px">
<label><input type="radio" name="md" value="tl" checked> タイムラプス</label>
<label><input type="radio" name="md" value="fx"> 普通の定点（音あり）</label>
</div></div>

<canvas id="c" width="640" height="360"></canvas>
<canvas id="bar" width="640" height="70"></canvas>
<div class="st" id="st">動画を選んでください</div>
<label>位置 <b id="vp">0.0</b>秒 <input type="range" id="sk" min="0" max="100" step="0.1" value="0" disabled></label>

<div class="row"><h2>② 動きがない部分をカット</h2>
<button id="an" disabled>解析する</button>
<label>動きなしと判定する基準 <b id="v6">1.0</b>%（大きいほど多くカット） <input type="range" id="mt" min="0.1" max="10" step="0.1" value="1"></label>
<label>この秒数以上 動きがなければカット <b id="v7">2</b>秒 <input type="range" id="ml" min="0.5" max="10" step="0.5" value="2"></label>
<label>カットの前後に残す余白 <b id="v8">0.3</b>秒 <input type="range" id="mg" min="0" max="2" step="0.1" value="0.3"></label>
<div class="st" id="rs">まだ解析していません</div>
<div class="st">バー：灰色の山＝動きの量、赤＝カットされる所、横線＝基準</div>
</div>

<div class="row tl"><h2>④ 早送り・ブラー</h2>
<label>早送り <b id="v1">4</b>倍 <input type="range" id="sp" min="1" max="16" step="1" value="4"></label>
<label><input type="checkbox" id="be" checked> 動いた部分にブラーをかける</label>
<label>動き検出の感度（小さいほど敏感） <b id="v2">25</b> <input type="range" id="th" min="5" max="80" value="25"></label>
<label>ブラーの強さ <b id="v3">8</b> <input type="range" id="bl" min="0" max="30" value="8"></label>
<label>残像の長さ <b id="v4">60</b>% <input type="range" id="tr" min="0" max="90" value="60"></label>
<label>動き範囲の広げ具合 <b id="v5">10</b> <input type="range" id="dl" min="0" max="30" value="10"></label>
<label><input type="checkbox" id="ov"> 動き検出の範囲を赤で表示（確認用）</label>
</div>

<div class="row"><h2>⑤ 確認・書き出し</h2>
<button id="pv" disabled>プレビュー</button>
<button id="rc" disabled>書き出し（録画）</button>
<a id="dlk" style="display:none"></a>
<div class="st">カット後に残った部分だけを再生・録画します</div>
</div>

<script>
const $=id=>document.getElementById(id);
const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';
const c=$('c'),x=c.getContext('2d'),bar=$('bar'),bx=bar.getContext('2d');
const S=160;let W=640,H=360,sw=S,sh=90;
const m=document.createElement('canvas'),mx=m.getContext('2d',{willReadFrequently:true});
const mk=document.createElement('canvas'),mkx=mk.getContext('2d');
const t2=document.createElement('canvas'),t2x=t2.getContext('2d');
const tmp=document.createElement('canvas'),tx=tmp.getContext('2d');
const tr=document.createElement('canvas'),trx=tr.getContext('2d');
const ovc=document.createElement('canvas'),ovx=ovc.getContext('2d');
let prev=null,running=false,rec=null,dur=0;
let scores=[],step=0.5,segs=[],segI=0;
const isTL=()=>document.querySelector('input[name=md]:checked').value==='tl';
function setMode(){document.body.classList.toggle('tlmode',isTL())}
document.querySelectorAll('input[name=md]').forEach(r=>r.onchange=setMode);setMode();
[['sp',1,0],['th',2,0],['bl',3,0],['tr',4,0],['dl',5,0],['mt',6,1],['ml',7,1],['mg',8,1]].forEach(([id,n,re])=>{
 const e=$(id);e.oninput=()=>{$('v'+n).textContent=e.value;if(re)calcSegs();};
});
function seekTo(t){return new Promise(r=>{const h=()=>{v.removeEventListener('seeked',h);r()};v.addEventListener('seeked',h);v.currentTime=Math.min(t,Math.max(0,dur-0.05));})}

$('f').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 v.src=URL.createObjectURL(f);
 v.onloadedmetadata=()=>{
  dur=v.duration;
  const sc=Math.min(1,1280/v.videoWidth);
  W=Math.round(v.videoWidth*sc/2)*2;H=Math.round(v.videoHeight*sc/2)*2;
  [c,tmp,tr,ovc].forEach(k=>{k.width=W;k.height=H});
  sw=S;sh=Math.round(S*H/W);[m,mk,t2].forEach(k=>{k.width=sw;k.height=sh});
  scores=[];segs=[{s:0,e:dur}];
  $('sk').max=dur;$('sk').disabled=false;
  ['an','pv','rc'].forEach(id=>$(id).disabled=false);
  $('st').textContent=`読み込みOK ${W}x${H} / ${fmt(dur)}`;
  $('rs').textContent='まだ解析していません（このままだと全部使います）';
  seekTo(0).then(()=>{x.drawImage(v,0,0,W,H);drawBar();});
 };
};
function fmt(t){t=Math.max(0,t);const mm=Math.floor(t/60),ss=(t%60).toFixed(1);return mm?`${mm}分${ss}秒`:`${ss}秒`}
$('sk').oninput=()=>{const t=+$('sk').value;$('vp').textContent=t.toFixed(1);if(!running)seekTo(t).then(()=>{x.drawImage(v,0,0,W,H);drawBar();})};

// ② 解析：一定間隔でコマを取り、前と比べて「変わった画素の割合(%)」を記録
$('an').onclick=async()=>{
 if(running)return;
 ['an','pv','rc'].forEach(id=>$(id).disabled=true);
 step=Math.max(0.5,dur/1500);
 const n=Math.floor(dur/step)+1;scores=new Float32Array(n);
 let last=null;const t0=performance.now();
 for(let i=0;i<n;i++){
  await seekTo(i*step);
  mx.drawImage(v,0,0,sw,sh);const d=mx.getImageData(0,0,sw,sh).data;
  if(last){let ch=0;for(let k=0;k<d.length;k+=4){
    if(Math.abs(d[k]-last[k])+Math.abs(d[k+1]-last[k+1])+Math.abs(d[k+2]-last[k+2])>60)ch++;}
   scores[i]=ch/(sw*sh)*100;}
  last=d;
  if(i%10===0){x.drawImage(v,0,0,W,H);
   const el=(performance.now()-t0)/1000,rest=el/(i+1)*(n-i-1);
   $('st').textContent=`解析中 ${Math.round(i/n*100)}%（残り約${Math.ceil(rest)}秒）`;drawBar(i);}
 }
 if(n>1)scores[0]=scores[1];
 calcSegs();
 ['an','pv','rc'].forEach(id=>$(id).disabled=false);
 $('st').textContent='解析完了。基準をスライダーで調整できます';
};
function calcSegs(){
 if(!scores.length){segs=[{s:0,e:dur}];drawBar();return;}
 const th=+$('mt').value,ml=+$('ml').value,mg=+$('mg').value;
 const cuts=[];let st=-1;
 for(let i=0;i<=scores.length;i++){
  const still=i<scores.length&&scores[i]<th;
  if(still&&st<0)st=i;
  if(!still&&st>=0){const a=st*step,b=Math.min(dur,i*step);
   if(b-a>=ml){const ca=a===0?0:a+mg,cb=b>=dur-step?dur:b-mg;if(cb-ca>0.1)cuts.push([ca,cb]);}
   st=-1;}
 }
 segs=[];let p=0;
 cuts.forEach(([a,b])=>{if(a-p>0.1)segs.push({s:p,e:a});p=b;});
 if(dur-p>0.1)segs.push({s:p,e:dur});
 const keep=segs.reduce((q,s)=>q+s.e-s.s,0);
 $('rs').textContent=`${fmt(dur)} → ${fmt(keep)}（${cuts.length}か所カット）`+(isTL()?` ／ ${$('sp').value}倍速で約${fmt(keep/+$('sp').value)}`:'');
 drawBar();
}
function drawBar(upto){
 const bw=bar.width=bar.clientWidth*devicePixelRatio||640,bh=bar.height=70*devicePixelRatio;
 bx.clearRect(0,0,bw,bh);if(!dur)return;
 const X=t=>t/dur*bw;
 // カット部分（赤）
 if(scores.length&&upto===undefined){bx.fillStyle='rgba(229,57,53,.45)';let p=0;
  segs.forEach(s=>{if(s.s>p)bx.fillRect(X(p),0,X(s.s)-X(p),bh);p=s.e});if(p<dur)bx.fillRect(X(p),0,bw-X(p),bh);}
 // 動きの量
 if(scores.length){const mxs=Math.max(5,+$('mt').value*3);bx.fillStyle='rgba(128,128,128,.8)';
  const n=upto===undefined?scores.length:upto;
  for(let i=0;i<n;i++){const h=Math.min(1,scores[i]/mxs)*bh;bx.fillRect(X(i*step),bh-h,Math.max(1,X(step)),h);}
  const ty=bh-Math.min(1,+$('mt').value/mxs)*bh;bx.fillStyle='#e53935';bx.fillRect(0,ty,bw,2*devicePixelRatio);}
 // 現在位置
 bx.fillStyle='#2563eb';bx.fillRect(X(v.currentTime)-1,0,3*devicePixelRatio,bh);
}
bar.onpointerdown=bar.onpointermove=e=>{if(running||!dur||(e.type==='pointermove'&&!e.buttons))return;
 const r=bar.getBoundingClientRect(),t=(e.clientX-r.left)/r.width*dur;$('sk').value=t;$('sk').oninput();};

// ④ フレーム描画（タイムラプスでブラーONの時だけ効果）
function frame(){
 x.globalAlpha=1;x.globalCompositeOperation='source-over';
 if(!(isTL()&&$('be').checked)){x.drawImage(v,0,0,W,H);return;}
 const th=+$('th').value,bl=+$('bl').value,tl=+$('tr').value/100,dl=+$('dl').value;
 mx.drawImage(v,0,0,sw,sh);
 const cur=mx.getImageData(0,0,sw,sh);
 const out=t2x.createImageData(sw,sh);
 if(prev){const a=cur.data,b=prev.data,o=out.data;
  for(let i=0;i<a.length;i+=4){
   const d=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);
   o[i+3]=d>th*3?255:0;o[i]=255;}}
 prev=cur;
 t2x.putImageData(out,0,0);
 mkx.clearRect(0,0,sw,sh);mkx.filter=`blur(${dl*sw/W*2}px)`;mkx.drawImage(t2,0,0);mkx.filter='none';
 x.drawImage(v,0,0,W,H);
 trx.globalCompositeOperation='destination-out';trx.fillStyle=`rgba(0,0,0,${1-tl})`;trx.fillRect(0,0,W,H);
 trx.globalCompositeOperation='source-over';
 tx.globalCompositeOperation='source-over';tx.clearRect(0,0,W,H);
 tx.filter=bl>0?`blur(${bl}px)`:'none';tx.drawImage(v,0,0,W,H);tx.filter='none';
 tx.globalCompositeOperation='destination-in';tx.drawImage(mk,0,0,W,H);tx.globalCompositeOperation='source-over';
 x.drawImage(tr,0,0);x.drawImage(tmp,0,0);trx.drawImage(tmp,0,0);
 if($('ov').checked){ovx.globalCompositeOperation='source-over';ovx.clearRect(0,0,W,H);ovx.drawImage(mk,0,0,W,H);
  ovx.globalCompositeOperation='source-in';ovx.fillStyle='rgba(255,0,0,.5)';ovx.fillRect(0,0,W,H);x.drawImage(ovc,0,0);}
}

// ⑤ 残った区間を順番に再生
let busy=false;
function loop(){
 if(!running)return;
 const sg=segs[segI];
 if(!busy&&(v.currentTime>=sg.e-0.02||v.ended)){nextSeg();return;}
 frame();drawBar();
 $('st').textContent=`再生 ${segI+1}/${segs.length}区間 ${fmt(v.currentTime)}`+(rec?'（録画中・画面を閉じないで）':'');
 if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(loop);else requestAnimationFrame(loop);
}
async function nextSeg(){
 segI++;if(segI>=segs.length){stop();return;}
 busy=true;v.pause();if(rec&&rec.state==='recording')rec.pause();
 await seekTo(segs[segI].s);
 if(rec&&rec.state==='paused')rec.resume();
 busy=false;await v.play();loop();
}
async function start(){
 if(!segs.length){$('st').textContent='残る部分がありません。基準を下げてください';return false;}
 prev=null;trx.clearRect(0,0,W,H);segI=0;
 await seekTo(segs[0].s);
 v.playbackRate=isTL()?+$('sp').value:1;
 running=true;$('pv').textContent='停止';
 ['an','rc'].forEach(id=>$(id).disabled=true);
 if(rec)rec.start();
 await v.play();loop();return true;
}
function stop(){
 running=false;v.pause();
 if(rec&&rec.state!=='inactive')rec.stop();
 $('pv').textContent='プレビュー';['an','rc','pv'].forEach(id=>$(id).disabled=false);
 if(!rec)$('st').textContent='停止しました';
}
$('pv').onclick=()=>{if(running){stop();return;}start();};

let actx=null,adst=null;
function audioTrack(){
 try{
  if(!actx){actx=new AudioContext();const src=actx.createMediaElementSource(v);adst=actx.createMediaStreamDestination();src.connect(adst);}
  actx.resume();return adst.stream.getAudioTracks()[0];
 }catch(e){return null}
}
$('rc').onclick=()=>{
 if(running)return;
 const stream=c.captureStream(30);
 if(!isTL()){const at=audioTrack();if(at){stream.addTrack(at);v.muted=false;}}
 else v.muted=true;
 const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
 const chunks=[];rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:8e6});
 rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 rec.onstop=()=>{
  v.muted=true;
  const ext=mt.includes('mp4')?'mp4':'webm';const blob=new Blob(chunks,{type:mt||'video/webm'});rec=null;
  const a=$('dlk');a.textContent='★保存する（タップ）';a.style.cssText='display:block;font-size:18px;padding:12px;color:var(--ac)';
  a.href=URL.createObjectURL(blob);a.download='teiten_cut.'+ext;
  $('st').textContent='録画完了。下のリンクから保存';
 };
 $('dlk').style.display='none';
 start().then(ok=>{if(!ok)rec=null});
};
window.addEventListener('resize',()=>drawBar());
</script></body></html>
